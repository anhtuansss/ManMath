services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    container_name: manmath-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DRAFT_PREVIEW_AUTHORIZED_EMAILS: ${DRAFT_PREVIEW_AUTHORIZED_EMAILS:-}
    ports:
      - "127.0.0.1:5000:5000"